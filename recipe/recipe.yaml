# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "7.5.1"
  python_check_max: "3.14"

recipe:
  name: robotframework
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/r/robotframework/robotframework-${{ version }}.tar.gz
    sha256: 00f63dc7b0477a137f8a9c1f2e14db8084a4d187a76f3fec6c2567875c32b932
    target_directory: dist
  - url: https://github.com/robotframework/robotframework/archive/v${{ version }}.tar.gz
    sha256: bdbea9c9531cb44a88f1769b844e703fde16525d4d6a12e4bcc2240f3b39c63c
    target_directory: src

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: robotframework
    build:
      script:
        - cd dist
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
      python:
        entry_points:
          - robot = robot.run:run_cli
          - rebot = robot.rebot:rebot_cli
          - libdoc = robot.libdoc:libdoc_cli
    requirements:
      host:
        - pip
        - python ${{ python_min }}.*
        - setuptools
      run:
        - python >=${{ python_min }}
    tests:
      - python:
          imports: robot
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - package_contents:
          site_packages:
            - robot/**
            - robotframework-${{ version }}.dist-info/**
          strict: true
      - requirements:
          run:
            - python ${{ python_min }}.*
        script:
          - echo "*** Test Cases ***"                   >> test-${{ version }}.robot
          - echo "Hello World"                          >> test-${{ version }}.robot
          - echo "    Log   %{PKG_NAME} %{PKG_VERSION}" >> test-${{ version }}.robot
          - robot test-${{ version }}.robot
          - rebot output.xml
          - libdoc test-${{ version }}.robot test.html
          - robot --version --nostatusrc
          - robot --version --nostatusrc | ${{ "grep -iE" if unix else "findstr /c" }} " ${{ version | replace('.', '\\.') }} "

  - package:
      name: _robotframework_tests
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("robotframework", exact=True) }}
        - python ${{ python_min }}.*
    tests:
      - files:
          source:
            - src/utest/
            - src/atest/
            - src/doc/schema/
            - src/README.rst
        requirements:
          run:
            - coverage
            - docutils
            - jsonschema
            - lxml
            - markdown
            - pillow
            - pygments
            - pyyaml
        script:
          - cd src/utest
          - coverage run --source=robot --branch run.py
          - coverage report --show-missing --skip-covered --fail-under=71

about:
  license: Apache-2.0
  license_file:
    - dist/LICENSE.txt
    - dist/COPYRIGHT.txt
  summary: Generic automation framework for acceptance testing and robotic process automation (RPA)
  description: >
    Robot Framework is a generic open source automation framework for acceptance testing, acceptance test driven development (ATDD), and robotic process automation (RPA). It has simple plain text syntax and it can be extended easily with libraries implemented using Python or Java.
  homepage: https://pypi.org/project/robotframework
  repository: https://github.com/robotframework/robotframework
  documentation: https://robotframework.org/robotframework

extra:
  feedstock-name: robotframework
  recipe-maintainers:
    - abloemert
    - bollwyvl
